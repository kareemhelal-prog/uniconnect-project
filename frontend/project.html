<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login UniConnect</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>

@keyframes pulse-glow {
        0%,
        100% {
          opacity: 0.3;
          transform: scale(1);
        }
        50% {
          opacity: 0.5;
          transform: scale(1.1);
        }
      }
      .glow-effect {
        animation: pulse-glow 8s infinite ease-in-out;
      }
    </style>
  </head>
  <body
    class="bg-[#050510] min-h-screen flex items-center justify-center p-6 overflow-hidden relative">
    <div
      class="absolute top-[-10%] left-[-10%] w-[50%] h-[50%] bg-blue-600/20 rounded-full blur-[120px]"></div>
    <div
      class="absolute bottom-[-10%] right-[-10%] w-[50%] h-[50%] bg-purple-600/20 rounded-full blur-[120px]"></div>

    <div class="relative z-10 w-full max-w-5xl flex flex-col items-center">
      <div class="flex flex-col items-center mb-12">
        <img
          src="log.png"
          alt="Logo"
          class="w-24 h-24 mb-2 drop-shadow-[0_0_15px_rgba(255,255,255,0.3)]" />
        <h1
          class="text-3xl font-bold tracking-tighter bg-gradient-to-r from-cyan-400 via-pink-500 to-orange-400 bg-clip-text text-transparent">
          UniConnect
        </h1>
      </div>

      <div class="grid md:grid-cols-3 gap-6 w-full items-start">
        <div
          class="md:col-span-2 bg-white/[0.03] backdrop-blur-xl border border-white/10 rounded-[40px] p-12 shadow-2xl relative overflow-hidden">
          <div
            class="absolute top-0 left-0 w-full h-full border border-cyan-500/20 rounded-[40px] pointer-events-none"></div>

          <h2 class="text-3xl font-semibold text-cyan-400 mb-10">
            Log In or Register
          </h2>

          <form class="space-y-6">
            <input
              type="email"
              placeholder="University Email"
              class="w-full bg-white/5 border border-white/10 rounded-full px-6 py-4 text-white placeholder:text-gray-500 outline-none focus:border-cyan-400/50 transition" />

            <div class="flex items-center gap-4">
              <input
                type="password"
                placeholder="Password"
                class="w-full bg-white/5 border border-white/10 rounded-full px-6 py-4 text-white placeholder:text-gray-500 outline-none focus:border-cyan-400/50 transition" />

              <div class="flex items-center gap-2 shrink-0">
                <span class="text-gray-400 text-sm">Remember Me</span>
                <label class="relative inline-flex items-center cursor-pointer">
                  <input type="checkbox" class="sr-only peer" />
                  <div
                    class="w-11 h-6 bg-white/10 rounded-full peer peer-checked:bg-purple-600 after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:rounded-full after:h-5 after:w-5 after:transition-all peer-checked:after:translate-x-full"></div>
                </label>
              </div>
            </div>

            <button
              class="w-full py-4 rounded-full bg-gradient-to-r from-cyan-500 via-purple-600 to-pink-500 text-white font-bold text-xl shadow-[0_0_25px_rgba(192,38,211,0.4)] hover:scale-[1.02] transition transform">
              LOG IN
            </button>
          </form>
          <div class="text-center mt-6">
            <a
              href="#"
              class="text-gray-500 hover:text-cyan-400 text-sm transition">Forgot
              Password?</a>
          </div>
        </div>

        <div
          class="bg-white/[0.03] backdrop-blur-xl border border-white/10 rounded-[40px] p-10 flex flex-col items-center justify-center text-center shadow-2xl">
          <h3 class="text-white text-xl font-medium">New to</h3>
          <span
            class="text-2xl font-bold bg-gradient-to-r from-cyan-400 to-pink-500 bg-clip-text text-transparent mb-8">UniConnect?</span>
          <button
            class="border-2 border-cyan-400 text-cyan-400 px-8 py-2 rounded-full font-bold hover:bg-cyan-400 hover:text-black transition">
            REGISTER
          </button>
        </div>
      </div>
    </div>
  </body>
</html>
