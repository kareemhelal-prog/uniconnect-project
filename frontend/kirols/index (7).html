\<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UniConnect - Neon Shield</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background: #02010a; overflow: hidden; font-family: sans-serif; }
        .txt-flow {
            background: linear-gradient(to right, #00d2ff, #9d50bb, #ff00c1, #00d2ff);
            -webkit-background-clip: text; color: transparent;
            animation: flow 2s linear infinite; background-size: 200%;}
        @keyframes flow { to { background-position: 200%; } }
        .neon-shield { 
            border: 2px solid rgba(0, 210, 255, 0.4); 
            box-shadow: 0 0 25px rgba(0, 210, 255, 0.2); }
        .orb { 
            position: absolute; width: 400px; height: 400px; 
            border-radius: 50%; filter: blur(100px); opacity: 0.4; 
            z-index: -1; animation: move 3s infinite alternate ease-in-out; }
        @keyframes move { from { transform: translate(-10%, -10%); } to { transform: translate(10%, 10%); } }
        .profile-img {
            width: 90px;
            height: 90px;
            border-radius: 50%;
            border: 3px solid #00d2ff;
            box-shadow: 0 0 20px rgba(0, 210, 255, 0.6);
            object-fit: cover;
            background: #02010a;}
    </style>
</head>
<body class="flex items-center justify-center min-h-screen p-4">
    <div class="orb bg-blue-600 top-0 left-0"></div>
    <div class="orb bg-purple-600 bottom-0 right-0" style="animation-delay: -1.5s"></div>
    <main class="relative z-10 w-full max-w-sm mt-10">
        <h1 class="text-4xl font-black text-white text-center mb-8 italic tracking-tighter">
            Uni<span class="txt-flow">Connect</span>
        </h1>
        <br>
        <div class="neon-shield bg-white/5 backdrop-blur-xl rounded-[40px] p-8 relative pt-14">
            <div class="absolute -top-12 left-1/2 transform -translate-x-1/2">
                <img src="https://uploads.onecompiler.io/44fxtmxfy/44fxtnnnt/WhatsApp%20Image%202026-03-10%20at%205.12.22%20PM.jpeg" alt="Profile" class="profile-img">
            </div>
            <h2 class="text-white text-center font-bold text-xl mb-6">Create Account</h2>
            <form class="space-y-4" onsubmit="event.preventDefault()">
                <input type="text" placeholder="Full Name" class="w-full bg-white/5 border border-white/20 rounded-xl px-4 py-3 text-white text-sm outline-none focus:border-cyan-400 transition-all placeholder:text-gray-600">
                <input type="email" placeholder="University Email" class="w-full bg-white/5 border border-white/20 rounded-xl px-4 py-3 text-white text-sm outline-none focus:border-cyan-400 transition-all placeholder:text-gray-600">
                <div class="flex gap-2">
                    <input type="password" placeholder="Pass" class="w-1/2 bg-white/5 border border-white/20 rounded-xl px-4 py-3 text-white text-sm outline-none focus:border-cyan-400 placeholder:text-gray-600">
                    <input type="password" placeholder="Confirm" class="w-1/2 bg-white/5 border border-white/20 rounded-xl px-4 py-3 text-white text-sm outline-none focus:border-cyan-400 placeholder:text-gray-600">
                </div>
                <button class="w-full py-3.5 bg-gradient-to-r from-cyan-500 via-blue-600 to-purple-700 text-white font-black rounded-xl hover:brightness-125 hover:scale-[1.02] active:scale-[0.98] transition-all shadow-lg shadow-cyan-500/20 uppercase tracking-widest text-xs mt-2">
                    Register
                </button>
            </form>
            <div class="mt-8 pt-6 border-t border-white/10 text-center">
                <button class="text-cyan-400 text-[10px] font-bold tracking-widest hover:underline uppercase transition-all">
                    Already a member? Log in
                </button>
            </div>
        </div>
    </main>
</body>
</html>
